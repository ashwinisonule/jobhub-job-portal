<div class="apply-page">

  <div class="apply-card">

    <div class="job-heading">

      <span class="job-category" *ngIf="job">
        {{ job.category }}
      </span>

      <h1>
        Apply for {{ job?.title }}
      </h1>

      <p>
        {{ job?.company }} • {{ job?.location }}
      </p>

    </div>


    <form (ngSubmit)="submitApplication()">

      <div class="form-group">

        <label>Full Name *</label>

        <input
          type="text"
          name="fullName"
          [(ngModel)]="application.fullName"
          placeholder="Enter your full name"
          required
        >

      </div>


      <div class="form-row">

        <div class="form-group">

          <label>Email *</label>

          <input
            type="email"
            name="email"
            [(ngModel)]="application.email"
            placeholder="Enter your email"
            required
          >

        </div>


        <div class="form-group">

          <label>Phone *</label>

          <input
            type="text"
            name="phone"
            [(ngModel)]="application.phone"
            placeholder="Enter your phone number"
            required
          >

        </div>

      </div>


      <div class="form-group">

        <label>Education *</label>

        <input
          type="text"
          name="education"
          [(ngModel)]="application.education"
          placeholder="e.g. MCA"
          required
        >

      </div>


      <div class="form-group">

        <label>Skills *</label>

        <input
          type="text"
          name="skills"
          [(ngModel)]="application.skills"
          placeholder="e.g. Angular, HTML, CSS, JavaScript"
          required
        >

      </div>


      <div class="form-group">

        <label>Cover Letter</label>

        <textarea
          name="coverLetter"
          [(ngModel)]="application.coverLetter"
          rows="6"
          placeholder="Write a short message to the employer">
        </textarea>

      </div>


      <div class="form-actions">

        <button
          type="button"
          class="cancel-btn"
          (click)="router.navigate(['/jobs'])">

          Cancel

        </button>

        <button
          type="submit"
          class="submit-btn">

          Submit Application

        </button>

      </div>

    </form>

  </div>

</div>
