<div class="profile-page">

  <div class="profile-header">
    <h1>My Profile</h1>
    <p>Manage your JobHub profile</p>
  </div>

  <div class="profile-card" *ngIf="user">

    <div class="avatar">
      {{ user.name?.charAt(0).toUpperCase() }}
    </div>

    <h2>{{ user.name }}</h2>

    <p class="role">Job Seeker</p>

    <div class="profile-info">

      <div>
        <span>Email</span>
        <strong>{{ user.email }}</strong>
      </div>

      <div>
        <span>Account Type</span>
        <strong>Candidate</strong>
      </div>

    </div>

    <button class="edit-btn">
      Edit Profile
    </button>

  </div>

  <div class="no-profile" *ngIf="!user">
    <h2>Please Login</h2>
    <p>You need to login to view your profile.</p>
  </div>

</div>
